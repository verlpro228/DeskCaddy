name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build DeskCaddy.slnx -c Release -p:NuGetAudit=false

      - name: Engine self-test
        run: .\src\DeskCaddy.Cli\bin\Release\net10.0-windows\DeskCaddy.Cli.exe selftest 50
